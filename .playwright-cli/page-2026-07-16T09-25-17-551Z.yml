            - text: Kurzantwort
            - paragraph [ref=e275]: Holz wird in Faserrichtung geschliffen, vollständig entstaubt und nur dünn geölt. Nach der Einwirkzeit muss überschüssiges Öl restlos abgenommen werden. Mehrere dünne Aufträge sind sicherer als eine satte Schicht.
