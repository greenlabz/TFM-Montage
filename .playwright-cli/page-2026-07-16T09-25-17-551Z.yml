                - generic [ref=e301]:
                  - heading "Oberfläche bestimmen" [level=3] [ref=e302]
                  - paragraph [ref=e303]: Öl gehört auf rohes oder bereits geöltes Holz. Lackierte Flächen nehmen es nicht auf. An einer verdeckten Stelle zeigt ein Wassertropfen, ob die Fläche saugt. Perlt er vollständig ab, liegt meist eine geschlossene Beschichtung vor.
              - generic [ref=e304]:
                - generic [ref=e305]: "02"
                - generic [ref=e306]:
                  - heading "Gleichmäßig vorbereiten" [level=3] [ref=e307]
                  - paragraph [ref=e308]: In Faserrichtung schleifen und die Körnung nicht überspringen. Kanten nur leicht brechen. Staub aus Poren und Fugen entfernen; feuchter Schleifstaub erzeugt später Flecken.
              - generic [ref=e309]:
                - generic [ref=e310]: "03"
                - generic [ref=e311]:
                  - heading "Dünn sättigen" [level=3] [ref=e312]
                  - paragraph [ref=e313]: Öl abschnittsweise mit Tuch oder Pinsel verteilen. Produktangabe zur Einwirkzeit beachten. Trockene Stellen nachversorgen, Pfützen und Läufer vermeiden.
              - generic [ref=e314]:
                - generic [ref=e315]: "04"
                - generic [ref=e316]:
                  - heading "Überschuss abnehmen" [level=3] [ref=e317]
                  - paragraph [ref=e318]: Mit sauberem Tuch so lange nachwischen, bis die Fläche trocken wirkt. Klebrige Stellen entstehen fast immer durch zu viel Öl. Erst nach vollständiger Trocknung einen zweiten dünnen Auftrag prüfen.
              - generic [ref=e319]:
                - generic [ref=e320]: "05"
                - generic [ref=e321]:
                  - heading "Tücher sicher lagern" [level=3] [ref=e322]
                  - paragraph [ref=e323]: "Ölgetränkte Tücher können sich selbst entzünden. Nach Herstellerangabe behandeln: ausgebreitet im Freien trocknen oder in einem dicht schließenden, geeigneten Metallbehälter verwahren und örtlich korrekt entsorgen."
